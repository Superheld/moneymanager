[package]
name = "moneymanager"
version = "0.1.0"
description = "Moneymanager — lokale private Bilanz + Finanzplan"
authors = ["Bruce"]
edition = "2021"
# Welches Binary `cargo run` meint. Seit `src/bin/bestandslesen.rs` dazugekommen ist (das
# Werkzeug, mit dem die Waechter den verschluesselten Bestand lesen), gibt es zwei — und
# ohne diese Zeile bricht `npm run tauri dev` ab, bevor die App startet: "could not
# determine which binary to run". Der Fehler zeigt dabei auf cargo und nicht auf Tauri,
# und man sucht ihn an der falschen Stelle.
default-run = "moneymanager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moneymanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Der ganze Datenbankzugang laeuft hierueber (datenbank.rs). Frueher lag er beim
# SQL-Plugin und sqlx war nur fuer den Transaktions-Command noetig; seit `PRAGMA key`
# eine Verbindung braucht, die wir selbst in der Hand haben, ist das Plugin ganz
# abgeloest.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# NICHT direkt benutzt — und trotzdem noetig.
#
# sqlx-sqlite bindet dieselbe Kiste; Cargo vereinigt die Features aller Nutzer einer
# Abhaengigkeit, also bekommt sqlx die hier gewaehlte C-Bibliothek. `bundled-sqlcipher`
# tauscht SQLite gegen SQLCipher aus: gleiche API, zusaetzlich `PRAGMA key`. Ohne diesen
# Eintrag gaebe es keinen Weg, an sqlx' Wahl der C-Bibliothek heranzukommen, ausser das
# Plugin zu forken.
#
# `-vendored-openssl`, weil sonst OpenSSL aus dem System kommen muesste — auf einem
# frischen Rechner und in der CI ist es dort nicht. Der Preis ist Bauzeit beim ersten Mal.
#
# Die Version muss zu der passen, die sqlx zieht (0.30.x). Zwei Fassungen waeren zwei
# verschiedene C-Bibliotheken im selben Prozess.
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }

# Die Schluesselverwaltung (schluessel.rs). Alles aus dem RustCrypto-Projekt, nichts
# selbst gebaut — bei Krypto ist die eigene Konstruktion immer die schlechtere.
#
# argon2:            Passphrase -> Schluessel, absichtlich langsam und speicherhungrig
# chacha20poly1305:  wickelt den Datenschluessel ein (XChaCha20, 24-Byte-Nonce)
# rand:              der Zufall fuer Datenschluessel, Salz und Nonce
# zeroize:           wischt Schluessel aus dem Speicher, statt sie liegen zu lassen
# data-encoding:     Base32 fuer den Wiederherstellungscode, Base64 fuer die Huelle
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"

# Der Lese-/Schreib-Schutz um den Pool (datenbank.rs). sqlx zieht tokio ohnehin —
# hier wird nur das `sync`-Feature ausdruecklich angefordert.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
# Nur fuer die Tests der Verschluesselung: sqlx ist async, und ohne Laufzeit laeuft kein
# einziger davon.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Nur fuer `umask` beim Start (dateirechte.rs). Steckt ohnehin transitiv im Baum;
# explizit, weil wir es direkt aufrufen. Auf Windows gibt es weder umask noch POSIX-Modi.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
