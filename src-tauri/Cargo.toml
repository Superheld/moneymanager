[package]
name = "moneymanager"
version = "0.1.0"
description = "Moneymanager — lokale private Bilanz + Finanzplan"
authors = ["Bruce"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moneymanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direkt gebraucht fuer den Transaktions-Command: tauri-plugin-sql fuehrt jedes Statement
# ueber den Pool aus und kann deshalb keine Transaktion klammern. Version an das Plugin
# gebunden (es traegt sqlx 0.8) - zwei sqlx-Versionen waeren zwei verschiedene Typen.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# NICHT direkt benutzt — und trotzdem noetig.
#
# sqlx-sqlite bindet dieselbe Kiste; Cargo vereinigt die Features aller Nutzer einer
# Abhaengigkeit, also bekommt sqlx die hier gewaehlte C-Bibliothek. `bundled-sqlcipher`
# tauscht SQLite gegen SQLCipher aus: gleiche API, zusaetzlich `PRAGMA key`. Ohne diesen
# Eintrag gaebe es keinen Weg, an sqlx' Wahl der C-Bibliothek heranzukommen, ausser das
# Plugin zu forken.
#
# `-vendored-openssl`, weil sonst OpenSSL aus dem System kommen muesste — auf einem
# frischen Rechner und in der CI ist es dort nicht. Der Preis ist Bauzeit beim ersten Mal.
#
# Die Version muss zu der passen, die sqlx zieht (0.30.x). Zwei Fassungen waeren zwei
# verschiedene C-Bibliotheken im selben Prozess.
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
# Nur fuer die Tests der Verschluesselung: sqlx ist async, und ohne Laufzeit laeuft kein
# einziger davon.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Nur fuer `umask` beim Start (dateirechte.rs). Steckt ohnehin transitiv im Baum;
# explizit, weil wir es direkt aufrufen. Auf Windows gibt es weder umask noch POSIX-Modi.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
