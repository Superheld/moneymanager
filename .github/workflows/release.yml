name: Release

# Baut bei einem Versions-Tag die macOS-App, signiert sie für den Updater und hängt
# Archiv, DMG und Manifest an ein GitHub-Release.
#
# WOZU ES DAS GIBT. Der Update-Knopf in der App fragt
# `releases/latest/download/latest.json`. Ohne ein Release, das genau diese Datei trägt,
# schlägt die Prüfung fehl — und schweigt, wie vorgesehen. Dieser Workflow ist die
# Gegenstelle.
#
# ZWEI EINSTELLUNGEN, DIE MAN NICHT ÄNDERN DARF, ohne den Updater zu brechen:
#
#   • `releaseDraft: false` — Assets eines Entwurfs sind ohne Anmeldung nicht abrufbar.
#     Ein Entwurf wäre bequem zum Nachsehen und macht den Updater blind.
#   • `prerelease: false` — `releases/latest/` überspringt Vorabversionen. Bei einer App
#     im Alpha-Stadium ist „prerelease" die naheliegende Wahl und liefert dann eine 404,
#     die aussieht wie „kein Update da".
#
# Beides ist der Grund, warum hier nichts auf „vorsichtig" steht: der Endpunkt muss
# erreichbar sein, sonst ist der ganze Weg tot.

on:
  push:
    tags:
      - "v*"
# Bewusst NICHT von Hand auslösbar: `tauri-action` braucht einen Tag-Namen, und ein
# erfundener erzeugte ein echtes Release mit einer Version, die es nicht gibt. Wer den
# Workflow prüfen will, setzt einen Tag und löscht ihn samt Release wieder.

jobs:
  macos:
    # macos-14 und neuer sind arm64. Intel-Macs bräuchten ein Universal-Binary
    # (`--target universal-apple-darwin`) — solange niemand eines hat, wäre das
    # Bauzeit ohne Empfänger.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Muss zur mise.toml im Repo passen — GitHub Actions liest die nicht selbst.
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust-Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      # Dieselben Prüfungen wie in der CI. Ein Release aus rotem Code wäre schlimmer als
      # keines: es liegt danach draussen und wird von installierten Apps eingespielt.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # DER TÜRSTEHER. Ohne ihn baut `tauri-action` klaglos ein unsigniertes Bundle,
      # haengt es an ein oeffentliches Release, und der Release-Text muss den Leuten
      # dann beibringen, bei einer FINANZ-App eine Sicherheitspruefung abzuschalten.
      #
      # Das ist der eigentliche Fehler — nicht das fehlende Zertifikat. Ein Zertifikat
      # kann man nachreichen; ein Release, das drausssen ist, nicht mehr. Deshalb bricht
      # der Lauf hier ab, statt etwas zu erzeugen, das niemand veroeffentlichen sollte.
      #
      # Dieselbe Regel gilt schon fuer den Updater-Schluessel, nur setzt tauri das dort
      # selbst durch. Hier tut es niemand, also tun wir es.
      #
      # Der LOKALE Weg (`npm run installieren`) ist davon unberuehrt: wer auf der eigenen
      # Maschine baut und dort installiert, weiss, was er tut. Gefaehrlich wird es erst,
      # wenn es Fremde herunterladen.
      - name: Ohne Apple-Signierung kein oeffentliches Release
        env:
          ZERTIFIKAT: ${{ secrets.APPLE_CERTIFICATE }}
          IDENTITAET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          fehlt=""
          [ -n "$ZERTIFIKAT" ] || fehlt="$fehlt APPLE_CERTIFICATE"
          [ -n "$IDENTITAET" ] || fehlt="$fehlt APPLE_SIGNING_IDENTITY"
          [ -n "$APPLE_ID" ]   || fehlt="$fehlt APPLE_ID"
          [ -n "$TEAM" ]       || fehlt="$fehlt APPLE_TEAM_ID"
          if [ -n "$fehlt" ]; then
            echo "ABGEBROCHEN — es fehlen:$fehlt"
            echo
            echo "Ein unsigniertes Bundle waere lauffaehig und trotzdem falsch: macOS"
            echo "meldet es als beschaedigt, und die einzige Abhilfe waere eine Anleitung"
            echo "an Fremde, Gatekeeper abzuschalten. Bei einer Finanz-App ist das der"
            echo "schlechteste Rat, den man geben kann."
            echo
            echo "Bis das Zertifikat da ist, laeuft der lokale Weg weiter:"
            echo "  npm run installieren"
            exit 1
          fi
          echo "Alle Signierungs-Secrets vorhanden."

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE-SIGNIERUNG UND NOTARISIERUNG. Ohne diese Secrets baut tauri-action
          # klaglos ein UNSIGNIERTES Bundle — es bricht nicht ab. Was dann herauskommt,
          # meldet macOS beim ersten Start als „beschaedigt", und die einzige Abhilfe ist
          # die xattr-Zeile im Release-Text unten: eine Anleitung an Fremde, bei einer
          # FINANZ-App eine Sicherheitspruefung abzuschalten. Genau deshalb steht hier
          # alles bereit, sobald die Secrets da sind.
          #
          # Was hinterlegt werden muss (Repository -> Settings -> Secrets):
          #   APPLE_CERTIFICATE          Developer-ID-Application-Zertifikat als .p12,
          #                              base64-kodiert
          #   APPLE_CERTIFICATE_PASSWORD das Kennwort dieser .p12
          #   APPLE_SIGNING_IDENTITY     "Developer ID Application: <Name> (<TeamID>)"
          #   APPLE_ID                   die Apple-ID fuer die Notarisierung
          #   APPLE_PASSWORD             ein app-spezifisches Kennwort, NICHT das echte
          #   APPLE_TEAM_ID              die Team-ID
          #
          # Die Notarisierung laeuft erst, wenn APPLE_ID, APPLE_PASSWORD und
          # APPLE_TEAM_ID zusammen gesetzt sind — Signierung allein genuegt nicht:
          # Gatekeeper verlangt bei einem geladenen Bundle beides.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Ohne diesen Schlüssel entsteht keine Signatur, und ohne Signatur weist jede
          # installierte App das Update ab. Der Build bricht dann ab — richtig so.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Die DK-Produktregistrierungsnummer. Sie wird zur BAUZEIT eingebacken; fehlt
          # das Secret, ist die App vollständig und der Bankabruf gesperrt. Ein Fork hat
          # dieses Secret nicht — das ist die Produktgrenze, mechanisch durchgesetzt.
          VITE_FINTS_PRODUKT_ID: ${{ secrets.FINTS_PRODUKT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Moneymanager __VERSION__
          # KEINE xattr-Anleitung mehr. Sie war notwendig, solange unsigniert
          # ausgeliefert wurde — und genau das kann seit dem Türsteher oben nicht mehr
          # passieren. Ein Release aus diesem Workflow ist signiert und notarisiert,
          # sonst gibt es keines. `src/auslieferung.test.ts` hält beides zusammen.
          releaseBody: |
            Lokale Haushalts-Finanz-App, Stadium **Alpha**.

            Signiert und notarisiert. Der Bestand wird beim ersten Start verschlüsselt —
            die Passphrase wird dabei gesetzt, und der Wiederherstellungscode gehört
            aufgeschrieben.
          # Siehe Kopf: beides muss false bleiben, sonst findet der Updater nichts.
          releaseDraft: false
          prerelease: false
          # Erzeugt `latest.json` neben den Artefakten — genau die Datei, die
          # `plugins.updater.endpoints` in tauri.conf.json anfragt.
          includeUpdaterJson: true
