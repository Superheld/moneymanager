name: Release

# Baut bei einem Versions-Tag die macOS-App, signiert sie für den Updater und hängt
# Archiv, DMG und Manifest an ein GitHub-Release.
#
# WOZU ES DAS GIBT. Der Update-Knopf in der App fragt
# `releases/latest/download/latest.json`. Ohne ein Release, das genau diese Datei trägt,
# schlägt die Prüfung fehl — und schweigt, wie vorgesehen. Dieser Workflow ist die
# Gegenstelle.
#
# ZWEI EINSTELLUNGEN, DIE MAN NICHT ÄNDERN DARF, ohne den Updater zu brechen:
#
#   • `releaseDraft: false` — Assets eines Entwurfs sind ohne Anmeldung nicht abrufbar.
#     Ein Entwurf wäre bequem zum Nachsehen und macht den Updater blind.
#   • `prerelease: false` — `releases/latest/` überspringt Vorabversionen. Bei einer App
#     im Alpha-Stadium ist „prerelease" die naheliegende Wahl und liefert dann eine 404,
#     die aussieht wie „kein Update da".
#
# Beides ist der Grund, warum hier nichts auf „vorsichtig" steht: der Endpunkt muss
# erreichbar sein, sonst ist der ganze Weg tot.

on:
  push:
    tags:
      - "v*"
# Bewusst NICHT von Hand auslösbar: `tauri-action` braucht einen Tag-Namen, und ein
# erfundener erzeugte ein echtes Release mit einer Version, die es nicht gibt. Wer den
# Workflow prüfen will, setzt einen Tag und löscht ihn samt Release wieder.

jobs:
  bauen:
    strategy:
      # NACHEINANDER, und das ist keine Vorsicht, sondern Pflicht.
      #
      # `latest.json` ist die Datei, die der Updater fragt, und sie traegt alle
      # Plattformen zusammen. tauri-action baut sie als READ-MODIFY-WRITE: es laedt die
      # vorhandene Datei vom Release, uebernimmt ihre `platforms` und schreibt die eigene
      # dazu (nachgesehen in `src/upload-version-json.ts` beim gepinnten SHA). Zwei Jobs,
      # die gleichzeitig lesen, sehen denselben Stand — und der zweite ueberschreibt den
      # Eintrag des ersten.
      #
      # Der Fehlschlag waere dabei STILL: die verlorene Plattform bekaeme vom Updater
      # "nichts Neues" statt eines Fehlers. Dieselbe Falle wie ein falscher
      # Plattformschluessel, und man sucht sie lange an der falschen Stelle.
      max-parallel: 1
      # macOS zuerst: der erste Job LEGT das Release an und setzt damit den Text (spaetere
      # finden es vor und lassen ihn unberuehrt). Faellt einer aus, sollen die anderen
      # trotzdem liefern — eine kaputte Plattform darf die uebrigen nicht mitnehmen.
      fail-fast: false
      matrix:
        include:
          # macos-14 und neuer sind arm64. Intel-Macs braeuchten ein Universal-Binary
          # (`--target universal-apple-darwin`) — solange niemand eines hat, waere das
          # Bauzeit ohne Empfaenger.
          - plattform: macos-latest
            ziele: app,dmg
          # NUR AppImage. Ein `.deb` kann sich nicht selbst austauschen, der Updater kann
          # es also nie ersetzen — es laege im Release und saehe aus wie ein Weg, der
          # keiner ist. Dieselbe Sorte Falle wie ein Knopf, der nichts tut.
          #
          # 22.04 und nicht `ubuntu-latest`: ein AppImage laeuft nur auf Systemen mit
          # mindestens der glibc, gegen die es gebaut wurde. Die aelteste unterstuetzte
          # Umgebung ist damit die richtige Wahl, nicht die neueste.
          - plattform: ubuntu-22.04
            ziele: appimage
          # NSIS und nicht MSI: der Updater kann beide ersetzen, aber ein NSIS-Installer
          # braucht keine Administratorrechte.
          - plattform: windows-latest
            ziele: nsis
    runs-on: ${{ matrix.plattform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Die Systempakete, ohne die Tauri auf Linux nicht baut. Auf den anderen beiden
      # Laeufern bringt das Abbild alles mit.
      - name: Linux-Systempakete
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Muss zur mise.toml im Repo passen — GitHub Actions liest die nicht selbst.
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust-Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      # Dieselben Prüfungen wie in der CI. Ein Release aus rotem Code wäre schlimmer als
      # keines: es liegt danach draussen und wird von installierten Apps eingespielt.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # DIE WEICHE. Sie entscheidet nicht, OB ausgeliefert wird, sondern WAS im
      # Release-Text steht.
      #
      # Bis zum 28.08.2026 stand hier ein Türsteher, der den Lauf abbrach, wenn die
      # Apple-Secrets fehlten. Seine Begründung nannte ausdrücklich den lokalen Weg als
      # die Tür, die offen bleibt: „wer auf der eigenen Maschine baut und dort
      # installiert, weiss, was er tut." Genau diese Tür ist zu — gebaut und ausgeliefert
      # wird ausschliesslich über GitHub, das Update kommt über den Updater in der App.
      # Ein Wächter, der daraufhin ALLES blockiert, blockiert nicht mehr das Riskante,
      # sondern das Einzige.
      #
      # Was von ihm bleibt und wichtiger ist als das Blockieren: **der Release-Text sagt
      # die Wahrheit über den Signierungsstand.** Ein unsigniertes Bundle unter der
      # Zeile „Signiert und notarisiert" wäre der eigentliche Schaden — schlimmer als
      # ein unsigniertes Bundle, dem man ansieht, dass es eines ist.
      #
      # Die beiden Signaturen sind dabei verschiedene Dinge und werden gern verwechselt:
      # die minisign-Signatur des Updaters (weiter unten, ohne sie bricht der Build ab)
      # verhindert, dass jemand ein Update unterschiebt. Die Apple-Signatur erlaubt einen
      # FRISCHEN Download zu starten. Eine bereits laufende App aktualisiert sich auch
      # ohne sie — Gatekeeper prüft nicht erneut.
      - name: Signierungsstand feststellen und Release-Text bauen
        id: text
        # OHNE DAS LAEUFT DER SCHRITT AUF WINDOWS IN POWERSHELL und stirbt an der ersten
        # Zeile. `bash` ist auf allen drei Laeufern da (auf Windows ueber Git Bash), also
        # gibt es genau ein Skript statt dreier.
        shell: bash
        env:
          ZERTIFIKAT: ${{ secrets.APPLE_CERTIFICATE }}
          ZERTIFIKAT_KENNWORT: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITAET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_KENNUNG: ${{ secrets.APPLE_ID }}
          APPLE_KENNWORT: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ZERTIFIKAT" ] && [ -n "$IDENTITAET" ] && [ -n "$APPLE_KENNUNG" ] && [ -n "$TEAM" ]; then
            signiert=ja
          else
            signiert=nein
          fi
          echo "Signiert und notarisiert: $signiert"

          # DIE APPLE-VARIABLEN ENTSTEHEN HIER ODER GAR NICHT.
          #
          # Sie standen bis zum 28.08.2026 im env-Block von tauri-action, und das war
          # falsch: ein fehlendes Secret wird dort zum LEEREN STRING, und GitHub setzt
          # die Variable trotzdem. Tauri prueft "ist gesetzt", nicht "hat Inhalt",
          # versucht ein `security import` mit nichts und bricht ab:
          #
          #   security: SecKeychainItemImport: One or more parameters ... not valid.
          #   failed codesign application: failed to import keychain certificate
          #
          # Gemessen, nicht vermutet — der Build lief 6:37 durch und starb erst beim
          # Buendeln. Zwei Tage lang unsichtbar, weil der Tuersteher davor abbrach; die
          # eine Aenderung hat den Fehler der anderen verdeckt.
          #
          # Ueber GITHUB_ENV und nicht ueber den env-Block, weil es dort keine Moeglichkeit
          # gibt, einen Schluessel WEGZULASSEN — nur einen leeren Wert zu setzen, und
          # genau der ist das Problem. Was hier nicht geschrieben wird, existiert im
          # naechsten Schritt nicht.
          # Nur auf macOS: auf den anderen Laeufern gaebe es nichts zu signieren, und ein
          # Zertifikat in der Umgebung eines Linux-Builds ist Geheimnis ohne Zweck.
          if [ "$signiert" = "ja" ] && [ "$RUNNER_OS" = "macOS" ]; then
            {
              echo "APPLE_CERTIFICATE<<WERTENDE"
              echo "$ZERTIFIKAT"
              echo "WERTENDE"
              echo "APPLE_CERTIFICATE_PASSWORD=$ZERTIFIKAT_KENNWORT"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITAET"
              echo "APPLE_ID=$APPLE_KENNUNG"
              echo "APPLE_PASSWORD=$APPLE_KENNWORT"
              echo "APPLE_TEAM_ID=$TEAM"
            } >> "$GITHUB_ENV"
          fi

          {
            echo "body<<TEXTENDE"
            echo "Lokale Haushalts-Finanz-App, Stadium **Alpha**."
            echo
            echo "Der Bestand wird beim ersten Start verschluesselt — die Passphrase wird dabei"
            echo "gesetzt, und der Wiederherstellungscode gehoert aufgeschrieben."
            echo
            echo "**macOS** (\`.dmg\`)"
            echo
            if [ "$signiert" = "ja" ]; then
              echo "Signiert und notarisiert."
            else
              # Solange unsigniert ausgeliefert wird, MUSS die Anleitung dabeistehen.
              # Sie wegzulassen macht das Bundle nicht sicherer — es macht nur den
              # Fehlschlag unerklaerlich: macOS meldet "beschaedigt", und wer die App
              # nicht selbst gebaut hat, hat keine Handhabe.
              echo "Nicht mit einem Apple-Zertifikat signiert: macOS meldet die App beim ersten"
              echo "Start als „beschaedigt“. Sie ist es nicht — einmalig freigeben mit"
              echo
              echo "    xattr -dr com.apple.quarantine /Applications/Moneymanager.app"
            fi
            echo
            echo "**Windows** (\`.exe\`)"
            echo
            echo "Nicht mit einem Authenticode-Zertifikat signiert: SmartScreen meldet einen"
            echo "unbekannten Herausgeber. Ueber \"Weitere Informationen\" laesst sich der Start"
            echo "erlauben."
            echo
            echo "**Linux** (\`.AppImage\`)"
            echo
            echo "Ausfuehrbar machen und starten; eine Signatur braucht es hier nicht. Nur das"
            echo "AppImage kann sich selbst aktualisieren — ein \`.deb\` koennte das nie, deshalb"
            echo "gibt es keins."
            echo
            echo "Ein bereits installierter Moneymanager aktualisiert sich ohne all das: der"
            echo "Updater prueft seine eigene Signatur, und die ist unabhaengig davon."
            echo "TEXTENDE"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Die sechs APPLE_*-Variablen stehen hier bewusst NICHT: sie entstehen im
          # Schritt darueber und nur dann, wenn die Secrets wirklich hinterlegt sind.
          # Ein leerer Wert an dieser Stelle bricht das Buendeln ab — siehe dort.
          #
          # Was hinterlegt werden muss (Repository -> Settings -> Secrets):
          #   APPLE_CERTIFICATE          Developer-ID-Application-Zertifikat als .p12,
          #                              base64-kodiert
          #   APPLE_CERTIFICATE_PASSWORD das Kennwort dieser .p12
          #   APPLE_SIGNING_IDENTITY     "Developer ID Application: <Name> (<TeamID>)"
          #   APPLE_ID                   die Apple-ID fuer die Notarisierung
          #   APPLE_PASSWORD             ein app-spezifisches Kennwort, NICHT das echte
          #   APPLE_TEAM_ID              die Team-ID
          #
          # Die Notarisierung laeuft erst, wenn APPLE_ID, APPLE_PASSWORD und
          # APPLE_TEAM_ID zusammen gesetzt sind — Signierung allein genuegt nicht:
          # Gatekeeper verlangt bei einem geladenen Bundle beides.
          # Ohne diesen Schlüssel entsteht keine Signatur, und ohne Signatur weist jede
          # installierte App das Update ab. Der Build bricht dann ab — richtig so.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Die DK-Produktregistrierungsnummer. Sie wird zur BAUZEIT eingebacken; fehlt
          # das Secret, ist die App vollständig und der Bankabruf gesperrt. Ein Fork hat
          # dieses Secret nicht — das ist die Produktgrenze, mechanisch durchgesetzt.
          VITE_FINTS_PRODUKT_ID: ${{ secrets.FINTS_PRODUKT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Moneymanager __VERSION__
          # Je Plattform genau die Formate, die der Updater auch ersetzen kann (siehe
          # Matrix oben). `bundle.targets` in tauri.conf.json steht auf "all" und bleibt
          # es — das ist die Vorgabe fuer einen Bau von Hand; hier wird eingegrenzt.
          args: --bundles ${{ matrix.ziele }}
          # Der Text kommt aus dem Schritt oben und nicht als Literal hierher: er hängt
          # davon ab, ob wirklich signiert wurde. Ein fest eingetragener Satz wäre in
          # genau dem Fall falsch, in dem es darauf ankommt.
          releaseBody: ${{ steps.text.outputs.body }}
          # Siehe Kopf: beides muss false bleiben, sonst findet der Updater nichts.
          releaseDraft: false
          prerelease: false
          # Erzeugt `latest.json` neben den Artefakten — genau die Datei, die
          # `plugins.updater.endpoints` in tauri.conf.json anfragt.
          includeUpdaterJson: true
