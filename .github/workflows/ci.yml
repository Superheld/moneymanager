name: CI

# Erzwingt Grün bei jedem Push auf main und für Pull Requests: Typecheck, Tests,
# Frontend-Build. Der schwere Tauri-/Rust-Bundle-Schritt läuft hier bewusst NICHT
# (braucht System-Libs, langsam) — dafür kommt später ein eigener Release-Workflow.

on:
  push:
    branches: [main, develop]
  pull_request:
  # WOZU DER WOCHENLAUF. Die Waechter unten pruefen Abhaengigkeiten gegen Datenbanken,
  # die sich ohne unser Zutun aendern: eine Schwachstelle wird gemeldet, waehrend hier
  # niemand etwas tippt. Ein Lauf, der nur bei Push startet, findet sie erst beim
  # naechsten Commit — bei einem Solo-Projekt koennen das Wochen sein. Montags frueh,
  # damit der Befund am Wochenanfang dasteht und nicht Freitagabend.
  schedule:
    - cron: "0 6 * * 1"
  # Von Hand ausloesbar, weil man nach einem Fund nicht bis Montag warten will.
  workflow_dispatch:

# Ausdrueckliche Rechte statt der Standardrechte des Tokens. Bei `pull_request` aus einem
# Fork ist er ohnehin nur lesend — aber das ist eine Eigenschaft der Ausloeser, nicht
# dieser Datei. Wer spaeter einen Ausloeser ergaenzt, erbt sonst still mehr, als der Lauf
# braucht: er baut und prueft, er schreibt nichts.
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Muss zur mise.toml im Repo passen — GitHub Actions liest die nicht selbst.
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (Frontend)
        run: npx vite build

      # Der Waechter fuer die npm-Seite. `--omit=dev` mit Absicht: eine Schwachstelle in
      # Vitest oder jsdom erreicht niemanden, der die App benutzt, und Dauerrot aus dem
      # Werkzeugkasten kostet den Waechter seine Glaubwuerdigkeit. `high` als Schwelle,
      # weil darunter fast nur transitive DoS-Meldungen liegen, gegen die eine lokale
      # App nichts einzuwenden hat.
      - name: Abhaengigkeiten (npm)
        run: npm audit --omit=dev --audit-level=high

      # Kommen die Pakete wirklich von der Registry? Prueft die Signaturen und
      # Herkunftsnachweise dessen, was installiert wurde. Faengt eine andere Sorte
      # Angriff als `npm audit`: nicht „bekannte Luecke", sondern „untergeschoben".
      - name: Signaturen (npm)
        run: npm audit signatures

      # Kein Paket fuehrt beim Installieren unbemerkt Code aus. Siehe den Kopf des
      # Skripts — warum es eine Allowlist ist und keine `ignore-scripts=true`.
      - name: Install-Skripte
        run: node scripts/install-skripte-pruefen.mjs

  # Die Rust-Seite. Ein EIGENER Job, weil er absichtlich NICHTS baut: `cargo-deny` liest
  # die Cargo.lock und die RustSec-Datenbank, mehr nicht. Damit bleibt die Entscheidung
  # oben unangetastet, den schweren Tauri-Build aus der CI herauszuhalten — der brauchte
  # System-Bibliotheken und Minuten, dieser Lauf braucht Sekunden.
  #
  # Die Konfiguration steht in deny.toml, samt Begruendung fuer jede Einzelfreigabe.
  lieferkette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Eine Fremd-Action im Lieferketten-Waechter ist nicht ohne Ironie. Sie laedt ein
      # fertiges Binary statt `cargo install` (Minuten). Wer das enger haben will, pinnt
      # sie auf einen Commit-SHA statt auf `v2` — dann faellt allerdings auch jede
      # Fehlerbehebung darin aus, bis jemand den SHA hebt.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories sources
